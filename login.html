<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hairitage Admin Login</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <section id="login">

        <h1>Admin Login</h1>

        <form id="login-form">

            <input
                type="text"
                id="username"
                placeholder="Username"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <p id="login-message"></p>

    </section>

    <script src="js/login.js"></script>

</body>

</html>
